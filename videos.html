<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para el ADMV 💕 - Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="navbar">
    <img src="src/logo.png" alt="Logo R & D" class="brand-logo" />
    <div class="navbar-inner">
      <span class="brand">Para Ti</span>
      <nav class="navbar-tabs" id="navbar-tabs">
        <span class="tab-glass-indicador" id="tab-glass-indicador"></span>
        <a href="index.html" class="tab-btn"><span>Inicio</span></a>
        <a href="recuerdos.html" class="tab-btn"><span>Nuestra Historia</span></a>
        <a href="fotos.html" class="tab-btn"><span>Fotos</span></a>
        <a href="videos.html" class="tab-btn activo"><span>Videos</span></a>
        <a href="cartas.html" class="tab-btn"><span>Cartas</span></a>
        <a href="preguntas.html" class="tab-btn"><span>Preguntas</span></a>
        <a href="premios.html" class="tab-btn"><span>Premios</span></a>
        <a href="nosotros.html" class="tab-btn"><span>Nosotros</span></a>
      </nav>
      <button id="btn-menu-movil" class="btn-menu-movil" aria-label="Abrir menú">☰</button>
    </div>
  </header>

  <main id="main-content">
    <section class="tab-panel activo" data-tab="videos">
      <h2>Videos</h2>
      <p class="descripcion">Usa las flechas para ver los demás. En la compu, pasa el mouse encima de uno para que se reproduzca; en el celular, tócalo.</p>

      <div class="videos-carrusel">
        <div class="pelicula-perf pelicula-perf-izq" aria-hidden="true"></div>
        <div class="pelicula-perf pelicula-perf-der" aria-hidden="true"></div>
        <button class="video-flecha video-flecha-izq" id="video-flecha-izq" aria-label="Videos anteriores">‹</button>
        <div class="videos-ventana">
          <div class="videos-pista" id="videos-pista">
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video1.mp4" type="video/mp4" /></video></div></div>
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video2.mp4" type="video/mp4" /></video></div></div>
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video3.mp4" type="video/mp4" /></video></div></div>
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video4.mp4" type="video/mp4" /></video></div></div>
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video5.mp4" type="video/mp4" /></video></div></div>
            <div class="video-card"><div class="video-marco"><video playsinline preload="metadata"><source src="src/fotos/video6.mp4" type="video/mp4" /></video></div></div>
          </div>
        </div>
        <button class="video-flecha video-flecha-der" id="video-flecha-der" aria-label="Videos siguientes">›</button>
      </div>

      <div class="videos-cinta" aria-hidden="true"></div>
      <p class="slogan videos-slogan">🎬 Cada video, un segundo que no queremos que se nos olvide 💕</p>
    </section>

    <footer class="footer">
      <div class="footer-corazones" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span>
      </div>
      <p>Hecho con 💕 para ti</p>
    </footer>
  </main>

  <audio id="musica-romantica" src="src/Romantic_Flight.mp3" preload="auto"> 
  <script src="src/JavaScript/videos.js"></script>
</body>
</html>
