<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para el ADMV 💕 - Premios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="navbar">
    <img src="src/logo.png" alt="Logo R & D" class="brand-logo" />
    <div class="navbar-inner">
      <span class="brand">Para Ti</span>
      <nav class="navbar-tabs" id="navbar-tabs">
        <span class="tab-glass-indicador" id="tab-glass-indicador"></span>
        <a href="index.html" class="tab-btn"><span>Inicio</span></a>
        <a href="recuerdos.html" class="tab-btn"><span>Nuestra Historia</span></a>
        <a href="fotos.html" class="tab-btn"><span>Fotos</span></a>
        <a href="videos.html" class="tab-btn"><span>Videos</span></a>
        <a href="cartas.html" class="tab-btn"><span>Cartas</span></a>
        <a href="preguntas.html" class="tab-btn"><span>Preguntas</span></a>
        <a href="premios.html" class="tab-btn activo"><span>Premios</span></a>
        <a href="nosotros.html" class="tab-btn"><span>Nosotros</span></a>
      </nav>
      <button id="btn-menu-movil" class="btn-menu-movil" aria-label="Abrir menú">☰</button>
    </div>
  </header>

  <main id="main-content">
    <section class="tab-panel activo" data-tab="premios">
      <div class="premios-contenedor-principal">
        <div class="premios-hero-content">
          <span class="premios-sub-tag">Ruleta del Amor</span>
          <h2>Sorpresas Especiales</h2>
          <p class="descripcion">Gira la ruleta y descubre un premio especial para canjear conmigo</p>

          <!--  Ruleta -->
          <div class="ruleta-sorpresa-box" id="ruleta-box">
            <div class="ruleta-circulo">
              <span class="ruleta-icono-centro">⭐</span>
            </div>
            <div class="ruleta-anillo-brillo"></div>
          </div>

          <button id="btn-generar-premio" class="boton-principal-premio">Girar Ruleta</button>

        </div>
      </div>
      
      <div class="modal-premio-overlay oculto" id="premio-modal" style="display: none">
        <div class="modal-premio-tarjeta">
          <div class="modal-corazones-decorativos">💖 💝 💖</div>
          <h3 class="modal-premio-titulo">¡Premio Ganado!</h3>
          <div class="modal-premio-caja-texto">
            <p class="premio-texto" id="premio-texto">...</p>
          </div>
          <div class="modal-premio-botones">
            <button id="btn-otro-premio" class="btn-modal-accion secundario">Girar de nuevo 🎡</button>
            <button id="btn-cerrar-premio" class="btn-modal-accion principal">Cerrar ❌</button>
          </div>
        </div>
      </div>

    </section>

    <footer class="footer">
      <div class="footer-corazones" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span>
      </div>
      <p>Hecho con 💕 para ti</p>
    </footer>
  </main>

  <canvas id="confetti-canvas"></canvas>
  <audio id="musica-romantica" src="src/Romantic_Flight.mp3" preload="auto"></audio> 
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="src/JavaScript/premios.js"></script>
</body>
</html>
