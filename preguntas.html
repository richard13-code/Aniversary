<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para el ADMV 💕 - Preguntas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header class="navbar">
    <img src="src/logo.png" alt="Logo R & D" class="brand-logo" />
    <div class="navbar-inner">
      <span class="brand">Para Ti</span>
      <nav class="navbar-tabs" id="navbar-tabs">
        <span class="tab-glass-indicador" id="tab-glass-indicador"></span>
        <a href="index.html" class="tab-btn"><span>Inicio</span></a>
        <a href="recuerdos.html" class="tab-btn"><span>Nuestra Historia</span></a>
        <a href="fotos.html" class="tab-btn"><span>Fotos</span></a>
        <a href="videos.html" class="tab-btn"><span>Videos</span></a>
        <a href="cartas.html" class="tab-btn"><span>Cartas</span></a>
        <a href="preguntas.html" class="tab-btn activo"><span>Preguntas</span></a>
        <a href="premios.html" class="tab-btn"><span>Premios</span></a>
        <a href="nosotros.html" class="tab-btn"><span>Nosotros</span></a>
      </nav>
      <button id="btn-menu-movil" class="btn-menu-movil" aria-label="Abrir menú">☰</button>
    </div>
  </header>

  <main id="main-content">
    <section class="tab-panel activo" data-tab="preguntas">
      <h2>Responde y gana</h2>
      <p class="descripcion">Contesta y desbloquea una sorpresa especial</p>
      <div id="preguntas-contenedor"></div>
    </section>

    <!-- MODAL O SECCIÓN DE VIDEO SECRETO DESBLOQUEABLE -->
    <div class="video-sorpresa-overlay oculto" id="video-sorpresa-modal" style="display: none;">
      <div class="video-sorpresa-tarjeta">
        <div class="modal-corazones-decorativos">💖 🎥 💖</div>
        <h3 class="modal-premio-titulo">¡Felicidades! 🎉</h3>
        <p class="video-sub-texto">Desbloqueaste el video secreto.</p>
        
        <div class="video-contenedor-reproductor">
          <video id="video-secreto" controls width="100%">
            <source src="src/fotos/video1.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
          </video>
        </div>

        <div class="modal-premio-botones" style="margin-top: 20px;">
          <button id="btn-cerrar-video" class="btn-modal-accion principal">Cerrar y guardar 💖</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-corazones" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span>
      </div>
      <p>Hecho con 💕 para ti</p>
    </footer>
  </main>

  <canvas id="confetti-canvas"></canvas>
  <audio id="musica-romantica" src="src/Romantic_Flight.mp3" preload="auto"></audio> 
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="src/JavaScript/preguntas.js"></script>
</body>
</html>
